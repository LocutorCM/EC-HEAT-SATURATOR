name: Build EC HEAT
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-macos:
    name: macOS - VST3 + AU
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3 + AU
        uses: actions/upload-artifact@v4
        with:
          name: EC-HEAT-macOS-VST3-AU
          path: build/EC_HEAT_artefacts/Release/
  build-windows:
    name: Windows - VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: EC-HEAT-Windows-VST3
          path: build/EC_HEAT_artefacts/Release/
